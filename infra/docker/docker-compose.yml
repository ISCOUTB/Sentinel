services:
  frontend:
    container_name: usv-hmi-frontend
    build:
      context: ../../frontend
    ports:
      - "8080:80"
    environment:
      - VITE_API_TARGET=http://backend:8000

  backend:
    container_name: usv-hmi-backend
    build:
      context: ../../backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-usv_user}:${MYSQL_PASSWORD:-usv_password}@db:3306/${MYSQL_DATABASE:-usv_hmi}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-360}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PROJECT_NAME: ${PROJECT_NAME:-USV HMI Backend}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,http://localhost:5173}
      COGNITO_REGION: ${TF_VAR_region_sentinel:-us-east-1}
      COGNITO_USER_POOL_ID: ${TF_VAR_user_pool_id:-us-east-1_PfMPPwYKa}
      COGNITO_APP_CLIENT_ID: ${TF_VAR_user_pool_client_id:-2i6r6a7hi79epi20b5uedgeo1e}
      AWS_ACCESS_KEY_ID: ${TF_VAR_my_access_key}
      AWS_SECRET_ACCESS_KEY: ${TF_VAR_my_secret_key}
      AWS_REGION: ${TF_VAR_region_sentinel:-us-east-1}
      IOT_ENDPOINT: ${TF_VAR_iot_endpoint}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INFLUXDB_URL: http://sentinel-influxdb:8086
    env_file:
      - ../../backend/.env
    networks:
      - default
      - iot-network
    depends_on:
      - db
    command:
      - sh
      - -c
      - python wait_for_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: mysql:8.0
    container_name: usv-hmi-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-usv_hmi}
      MYSQL_USER: ${MYSQL_USER:-usv_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-usv_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../../database/init.sql:/docker-entrypoint-initdb.d/init.sql
  adminer:
    image: adminer
    container_name: usv-hmi-adminer
    ports:
      - "8081:8080"

volumes:
  db_data:
  frontend_node_modules:

networks:
  default:
    name: docker_default
  iot-network:
    external: true
    name: iot-influx-bridge_default
