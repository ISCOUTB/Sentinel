services:
  frontend:
    container_name: usv-hmi-frontend
    build:
      context: ../../frontend
    ports:
      - "8080:8080"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    command: npm run dev
  backend:
    container_name: usv-hmi-backend
    build:
      context: ../../backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your-secret-key-here-change-this-in-production
      - DATABASE_URL=mysql+pymysql://usv_user:usv_password@db:3306/usv_hmi
      - ACCESS_TOKEN_EXPIRE_MINUTES=360
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - PROJECT_NAME=USV HMI Backend
      - API_V1_STR=/api/v1
      - BACKEND_CORS_ORIGINS=http://localhost:8080,http://localhost:3000,http://localhost:5173
    depends_on:
      - db
    command: ["sh", "-c", "sleep 10 && uvicorn main:app --host 0.0.0.0 --port 8000"]
  db:
    image: mysql:8.0
    container_name: usv-hmi-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: usv_hmi
      MYSQL_USER: usv_user
      MYSQL_PASSWORD: usv_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../../database/init.sql:/docker-entrypoint-initdb.d/init.sql
  adminer:
    image: adminer
    container_name: usv-hmi-adminer
    ports:
      - "8081:8080"

volumes:
  db_data: