services:
  frontend:
    container_name: usv-hmi-frontend
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - ../../.env

  backend:
    container_name: usv-hmi-backend
    build:
      context: ../../backend
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    networks:
      - default
    depends_on:
      - db
    command:
      - sh
      - -c
      - python wait_for_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: mysql:8.0
    container_name: usv-hmi-db
    env_file:
      - ../../.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../../database/init.sql:/docker-entrypoint-initdb.d/init.sql
      #adminer:
      #image: adminer
      #container_name: usv-hmi-adminer
      #ports:
      #- "8081:8080"

  influxdb:
    image: influxdb:2.7
    container_name: sentinel-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
    env_file:
      - ../../.env
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: [ "CMD", "influx", "ping", "--host", "http://localhost:8086" ]
      interval: 10s
      timeout: 5s
      retries: 10

  iot-influx-bridge:
    build:
      context: ../container/iot-influx-bridge
      dockerfile: Dockerfile
    container_name: sentinel-iot-influx-bridge
    env_file:
      - ../../.env
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../../tests/iot-emulator/certs:/certs:ro

volumes:
  db_data:
  frontend_node_modules:
  influxdb_data:
  influxdb_config:

networks:
  default:
    name: sentinel_network
